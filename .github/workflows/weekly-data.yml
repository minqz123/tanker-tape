name: Weekly data pull

# PortWatch publishes weekly on Tuesdays at 09:00 ET. This runs Wednesday
# 10:00 UTC, comfortably after publication in either US daylight-saving state,
# so a run always picks up that week's release rather than racing it.
on:
  schedule:
    - cron: "0 10 * * 3"
  workflow_dispatch:

# Needed to commit the regenerated figures back to the repository.
permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install project
        # The research extra brings matplotlib, needed for the figures below.
        run: uv sync --extra prices --extra research

      - name: Verify endpoints
        # Schema drift at the source is the most likely way this pipeline breaks
        # silently, so check before pulling and keep the output in the run log.
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: uv run tanker-tape verify-endpoints

      - name: Pull prices
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: uv run tanker-tape ingest-prices --start 2015-01-01

      - name: Pull PortWatch chokepoints
        run: uv run tanker-tape ingest-portwatch --dataset chokepoints

      - name: Pull PortWatch ports
        # Filtered server-side to the terminals in config/ports.yaml. An unfiltered
        # pull of this layer is millions of rows and cannot finish inside the timeout.
        run: uv run tanker-tape ingest-portwatch --dataset ports

      - name: Record the live ID maps
        # Committed to the repo so the ID-to-name mapping is documented rather than
        # re-derived. This is what settles whether Hormuz is really "chokepoint6".
        run: |
          uv run tanker-tape resolve-ids chokepoint --save data/reference/portwatch_chokepoints.csv
          uv run tanker-tape resolve-ids port --save data/reference/portwatch_ports.csv

      - name: Summarise
        run: uv run tanker-tape status

      # Upload before the derived steps, so a failure in feature building or
      # plotting never costs us the data that was successfully pulled.
      - name: Upload vintages
        uses: actions/upload-artifact@v4
        with:
          name: tanker-tape-data-${{ github.run_id }}
          path: data/
          retention-days: 90
          if-no-files-found: error

      - name: Build feature table
        run: uv run tanker-tape build-features

      - name: Render figures
        # These are committed below, so the README shows real pulled data. Nothing
        # here is synthetic: with no feature table the command fails rather than
        # drawing a plausible-looking series.
        run: uv run tanker-tape charts --output docs/figures

      - name: Commit refreshed figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/figures data/reference
          if git diff --cached --quiet; then
            echo "Figures and ID maps unchanged; nothing to commit."
          else
            git commit -m "Refresh figures and ID maps from the $(date -u +%Y-%m-%d) data pull"
            git push
          fi
