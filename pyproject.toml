[project]
name = "tanker-tape"
version = "0.1.0"
description = "Brent crude x AIS shipping signals: research pipeline, event study, and chokepoint dashboard."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "shapely>=2.0",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "websockets>=12.0",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
# Kept optional so the core pipeline installs fast and stays importable
# on machines (e.g. the collector VPS) that never run the research code.
prices = ["yfinance>=0.2.40", "fredapi>=0.5.1"]
research = ["lightgbm>=4.3", "matplotlib>=3.8", "jupyter>=1.0"]
dashboard = ["streamlit>=1.36", "plotly>=5.22", "pydeck>=0.9"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
tanker-tape = "tanker_tape.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tanker_tape"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# scikit-learn's estimator protocol is fit(X, y)/predict(X); renaming the argument
# would break duck-typing against every sklearn estimator we swap in.
"src/tanker_tape/analysis/forecast.py" = ["N803"]
# Tests reach into collector buffers to assert that overflow is counted, not silent.
"tests/*" = ["SLF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
